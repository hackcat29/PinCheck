name: PinCheck
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  unit:
    name: Evaluator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test

  smoke:
    name: Mainnet smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run test:live

  compatibility:
    name: Circuit compatibility
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The action that judges a pull request comes from the base commit, so the pull request cannot change it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
      # Only when this action is first introduced: the base commit has no action to run yet.
      - id: base
        run: |
          if [ -f action.yml ]; then echo "action=yes" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=PinCheck::The base commit predates the PinCheck action, so there is nothing trusted to run yet."
          fi
      - name: Gate pincheck.json
        if: steps.base.outputs.action == 'yes'
        uses: ./
        with:
          manifest: pincheck.json
      - name: Gate the original demo manifest
        if: ${{ !cancelled() && steps.base.outputs.action == 'yes' }}
        uses: ./
        with:
          manifest: demo/circuit.json
          artifact-name: pincheck-report-demo
