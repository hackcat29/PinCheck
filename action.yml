name: PinCheck circuit compatibility
description: Block a pull request that changes the behavior of a pinned TapeOut circuit on X Layer.
author: PinCheck
branding:
  icon: shield
  color: blue

inputs:
  manifest:
    description: Path of the manifest in your repository.
    default: pincheck.json
  rpc-url:
    description: X Layer mainnet RPC URL. Pass it from a secret if it contains a key. Defaults to https://rpc.xlayer.tech.
    default: ''
  site-url:
    description: PinCheck workbench URL used for links in the job summary. Leave empty to omit the links.
    default: ''
  artifact-name:
    description: Name of the uploaded JSON report artifact.
    default: pincheck-report
  github-token:
    description: Token used to read the manifest at the base and head commits. Needs contents read.
    default: ${{ github.token }}

outputs:
  decision:
    description: pass, fail or inconclusive.
    value: ${{ steps.gate.outputs.decision }}
  exit-code:
    description: 0 pass, 1 behavior or interface changed, 2 inconclusive or invalid manifest.
    value: ${{ steps.gate.outputs.exit-code }}
  report:
    description: Path of the JSON gate report on the runner.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    # Read the manifest as data at the base and head commits. Nothing from the pull request is executed.
    - id: manifests
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MANIFEST: ${{ inputs.manifest }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        MG_BASE: ${{ github.event.merge_group.base_sha }}
        MG_HEAD: ${{ github.event.merge_group.head_sha }}
      run: bash "$GITHUB_ACTION_PATH/action/read-manifests.sh"

    - id: gate
      shell: bash
      env:
        X_LAYER_RPC: ${{ inputs.rpc-url }}
        SITE_URL: ${{ inputs.site-url }}
        MANIFEST: ${{ inputs.manifest }}
        BASE_FILE: ${{ steps.manifests.outputs.base }}
        HEAD_FILE: ${{ steps.manifests.outputs.head }}
        PINCHECK_BASE_SHA: ${{ steps.manifests.outputs.base-sha }}
        PINCHECK_HEAD_SHA: ${{ steps.manifests.outputs.head-sha }}
      run: bash "$GITHUB_ACTION_PATH/action/run-gate.sh"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.gate.outputs.report != ''
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.gate.outputs.report }}
        if-no-files-found: ignore
        retention-days: 90

    - shell: bash
      if: always()
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
      run: exit "${CODE:-2}"
